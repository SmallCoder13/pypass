name: Create App Artifacts
on:
 pull_request:

 push:
   branches:
     - dev-branch

# Cancel active CI runs for a PR before starting another run
concurrency:
 group: ${{ github.workflow}}-${{ github.ref }}
 cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
 FORCE_COLOR: "1"

defaults:
 run:
   shell: bash

jobs:
  ci:
   name: Test and Package
   runs-on: ${{ matrix.runs-on }}

   strategy:
     fail-fast: false
     matrix:
       target: [ "Windows", "macOS", "Ubuntu-24.04", "Fedora-40", "Android"]
       include:
         - target: "Windows"
           output-format: "app"
           runs-on: "windows-latest"

         - target: "macOS"
           output-format: "app"
           runs-on: "macos-latest"

         - target: "Ubuntu-24.04"
           platform: "Linux"
           output-format: "system"
           runs-on: "ubuntu-latest"
           pre-command: |
             sudo apt update -y
             sudo apt upgrade -y
             sudo apt install -y socat libgirepository1.0-dev libcairo2-dev --fix-missing
           briefcase-run-prefix: "xvfb-run"
           briefcase-args: "--target ubuntu:24.04"

         - target: "Fedora-40"
           platform: "Linux"
           output-format: "system"
           runs-on: "ubuntu-latest"
           pre-command: |
             sudo apt update -y
             sudo apt upgrade -y
             sudo apt install -y socat libgirepository1.0-dev libcairo2-dev --fix-missing
           briefcase-run-prefix: "xvfb-run"
           briefcase-args: "--target fedora:40"

         - target: "Android"
           output-format: "Gradle"
           runs-on: "ubuntu-latest"
           pre-command: |
             # Enable KVM permissions for the emulator
             echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
               | sudo tee /etc/udev/rules.d/99-kvm4all.rules
             sudo udevadm control --reload-rules
             sudo udevadm trigger --name-match=kvm
           briefcase-run-args: >-
             --device '{"avd":"beePhone"}'
             --shutdown-on-exit
             --Xemulator=-no-window
             --Xemulator=-no-snapshot
             --Xemulator=-no-audio
             --Xemulator=-no-boot-anim

   steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Setup Python
       uses: actions/setup-python@v4
       with:
         python-version: "3.12"

     - name: Install Briefcase
       run: |
         python -m pip install -U pip setuptools wheel --break-system-packages
         python -m pip install briefcase --break-system-packages

     - name: Setup Environment
       working-directory: ./pypass
       run: |
         # Use GitHub's preinstalled JDK 17 for Android builds
         echo JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME_17_arm64}" | tee -a ${GITHUB_ENV}
         ${{ matrix.pre-command }}

     - name: Update briefcase tools
       working-directory: ./pypass
       run: briefcase upgrade --no-input --log

     - name: Build App
       working-directory: ./pypass
       run: |
         ${{ matrix.briefcase-build-prefix }} \
         briefcase build \
           ${{ matrix.platform || matrix.target }} \
           ${{ matrix.output-format }} \
           --test --no-input --log \
           ${{ matrix.briefcase-args }} \
           ${{ matrix.briefcase-build-args }}

     - name: Test App

       working-directory: ./pypass
       run: |
         ${{ matrix.briefcase-run-prefix }} \
         briefcase run \
           ${{ matrix.platform || matrix.target }} \
           ${{ matrix.output-format }} \
           --test --no-input --log \
           ${{ matrix.briefcase-args }} \
           ${{ matrix.briefcase-run-args }} \
           -- --api-key=${{ secrets.API_KEY }}

     - name: Package App
       working-directory: ./pypass
       run: |
         ${{ matrix.briefcase-package-prefix }} \
         briefcase package \
           ${{ matrix.platform || matrix.target }} \
           ${{ matrix.output-format }} \
           --update --adhoc-sign --no-input --log \
           ${{ matrix.briefcase-args }} \
           ${{ matrix.briefcase-package-args }}

     - name: Prep Release Data
       uses: SebRollen/toml-action@v1.2.0
       id: pypass_version
       with:
         file: "pypass/pyproject.toml"
         field: "tool.briefcase.version"

     - name: Ensure Latest tag exists
       uses: mukunku/tag-exists-action@v1.7.0
       id: latest_exists
       with: 
         tag: 'latest'

       if: ${{ steps.latest_exists.outputs.value }} == 'false'
       uses: makethenetgo/actions-create-tag@v1
       with:
         tag_name: "latest"
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

     - name: Create Tag for new Release
       uses: makethenetgo/actions-create-tag@v1
       with:
         tag_name: "v{{ steps.pypass_version.value }}"

     - name: Create New PyPass Release
       uses: ncipollo/release-action@v1
       with:
         tag: "v${{ steps.pypass_version.value }}"
          draft: true
          bodyFile: "pypass/CHANGELOG"
          artifacts: "pypass/dist"
       
     - name: Prep Logs
       id: prep_logs
       if: failure()
       uses: vimtor/action-zip@v1.2
       with:
         files: pypass/logs/*
         dest: logs.zip


     - name: Email Logs
       if: failure()
       uses: cinotify/github-action@main
       with:
         to: "SpyridonCoryell@protonmail.com"
         subject: "PyPass CI ${{ github.run_number }} Workflow log"
         body: "Github CI workflow ${{ github.run_number }} for PyPass failed. Attached are all available logs."
         attachment: "logs.zip"
